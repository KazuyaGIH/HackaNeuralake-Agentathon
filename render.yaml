# Blueprint do Render: servidor (API) e tela (Next.js) do Agentathon, ambos no plano gratuito.
# O plano gratuito "dorme" apos ~15 min sem uso e o disco nao e persistente (historico some ao reiniciar).
services:
  - type: web
    name: agentathon-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Demo publica em modo simulado: aceita clientes de fora (atras do proxy do Render) e qualquer origem.
      # Ao configurar AGENTATHON_NEURALAKE_API_KEY, proteja o acesso (AGENTATHON_AUTH_MODE=token).
      - key: AGENTATHON_AUTH_LOCAL_TRUST_ANY_CLIENT
        value: "true"
      - key: AGENTATHON_CORS_ORIGINS
        value: '["*"]'
      - key: AGENTATHON_DATA_DIR
        value: /tmp/agentathon-data

  - type: web
    name: agentathon
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    autoDeploy: true
    envVars:
      # Endereco PUBLICO do servidor acima (o navegador de quem usa chama a API direto; o host interno do Render nao serve).
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://agentathon-api.onrender.com
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
