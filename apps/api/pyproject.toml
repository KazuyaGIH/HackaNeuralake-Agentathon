[project]
name = "agentathon-api"
version = "0.1.0"
description = "Agentathon - hackathon entre equipes de agentes de IA (backend FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.1,<3",
  "aiosqlite>=0.22,<1",
  "alembic>=1.20,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.32",
  "pypdf>=6.19,<7",
  "langgraph>=1.2,<2",
  "anthropic>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../../tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
